name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Model tests
        run: make test

  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lin-x64
            os: ubuntu-22.04
            sdk: "lin-x64"
            cc: gcc
            cxx: g++
          - name: mac-arm64
            os: macos-latest
            sdk: "mac-x64%2Barm64 mac-arm64 mac-x64+arm64"
            cc: clang
            cxx: clang++
          - name: mac-x64
            os: macos-latest
            sdk: "mac-x64%2Barm64 mac-x64 mac-x64+arm64"
            cc: clang -arch x86_64
            cxx: clang++ -arch x86_64
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Get Rack SDK
        run: |
          for name in ${{ matrix.sdk }}; do
            url="https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${name}.zip"
            if curl -sSfL "$url" -o sdk.zip; then echo "Got $url"; break; fi
            echo "Not found: $url"
          done
          unzip -q sdk.zip -d "$RUNNER_TEMP"
      - name: Build
        run: |
          export RACK_DIR="$RUNNER_TEMP/Rack-SDK"
          make -j3 dist CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
      - name: Check for unresolved plugin symbols
        if: runner.os == 'Linux'
        run: |
          # Anything of ours left undefined would make Rack refuse to load the plugin.
          if nm -D --undefined-only plugin.so | c++filt | grep -E "serge::|Serge|DSG|SSG|NTO|VCM|VCF|RESEQ|TWS|RING|NOI|ASR|COM|STR|PRC|XFAD|VCA2|MIX|DCSM|PT::"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Serge-${{ matrix.name }}
          path: dist/*.vcvplugin

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make zip unzip curl mingw-w64-x86_64-gcc jq
      - name: Get Rack SDK
        run: |
          curl -sSfL "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-win-x64.zip" -o sdk.zip
          unzip -q sdk.zip -d sdk
      - name: Build
        run: |
          export RACK_DIR="$(pwd)/sdk/Rack-SDK"
          # Newer MinGW GCC rejects some template code in the Rack 2 SDK headers.
          make -j3 dist EXTRA_CXXFLAGS="-Wno-template-body -fpermissive"
      - uses: actions/upload-artifact@v4
        with:
          name: Serge-win-x64
          path: dist/*.vcvplugin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.vcvplugin
